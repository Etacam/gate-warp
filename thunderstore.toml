[config]
schemaVersion = "0.0.1"

[package]
namespace = "InterestedSC2"
name = "GateWarp"
versionNumber = "0.0.3"
description = "A mod for warping between network gates"
websiteUrl = "https://github.com/TheOmnipresence/gate-warp"
containsNsfwContent = false
[package.dependencies]
MIOModding-ModdingAPI = "2.0.3"


[build]
icon = "./Sprites/icon.png"
readme = "./THUNDERSTORE_README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/GateWarp"
target = ""


[publish]
repository = "https://thunderstore.io"
communities = [ "mio-memories-in-orbit", ]
[publish.categories]
mio-memories-in-orbit = []


